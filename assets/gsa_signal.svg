<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 150" width="100%" height="100%">
  <defs>
    <linearGradient id="gsaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>
    <pattern id="gsaGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGsa {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(66, 133, 244, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(52, 168, 83, 0.6)); }
    }
    .gsa-title {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 2px;
      fill: #4285F4;
    }
    .gsa-main {
      font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
      font-weight: 800;
      font-size: 17px;
      fill: #F8FAFC;
      letter-spacing: 1px;
    }
    .gsa-sub {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-size: 10px;
      fill: #94A3B8;
      letter-spacing: 1px;
    }
  </style>

  <rect width="850" height="150" rx="10" fill="url(#gsaBg)"/>
  <rect width="850" height="150" rx="10" fill="url(#gsaGrid)"/>
  <rect width="848" height="148" x="1" y="1" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Google 4-Color Top Accent Line -->
  <line x1="1" y1="2" x2="212" y2="2" stroke="#4285F4" stroke-width="3"/>
  <line x1="213" y1="2" x2="425" y2="2" stroke="#EA4335" stroke-width="3"/>
  <line x1="426" y1="2" x2="637" y2="2" stroke="#FBBC05" stroke-width="3"/>
  <line x1="638" y1="2" x2="849" y2="2" stroke="#34A853" stroke-width="3"/>

  <!-- Header -->
  <text x="35" y="32" class="gsa-title">COMMUNITY SIGNAL // LEADERSHIP MILESTONE</text>
  <text x="815" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#FBBC05" text-anchor="end">SIGNAL: VERIFIED</text>

  <!-- Left Icon Signal Node -->
  <g transform="translate(60, 80)">
    <circle cx="0" cy="0" r="24" fill="#0F172A" stroke="#4285F4" stroke-width="2"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#EA4335" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#FBBC05" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#34A853"/>
  </g>

  <!-- Content Text -->
  <text x="105" y="74" class="gsa-main">GOOGLE STUDENT AMBASSADOR</text>
  <text x="105" y="96" class="gsa-sub">
    RECOGNITION: <tspan fill="#CD7F32" font-weight="bold">BRONZE BATCH</tspan>  •  ACADEMY: <tspan fill="#4285F4">Google Gen AI Academy 2.0</tspan>
  </text>

  <!-- Right Badge Card -->
  <g transform="translate(660, 60)">
    <rect width="155" height="50" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="77.5" y="22" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8" text-anchor="middle">AMBASSADOR TIER</text>
    <text x="77.5" y="38" font-family="ui-monospace, monospace" font-weight="800" font-size="11" fill="#CD7F32" text-anchor="middle">BRONZE BATCH ●</text>
  </g>

  <!-- Footer Line -->
  <line x1="35" y1="125" x2="815" y2="125" stroke="#1E293B" stroke-width="1"/>
  <text x="425" y="139" font-family="ui-monospace, monospace" font-size="9" fill="#64748B" text-anchor="middle">
    Leading AI student communities, conducting workshops, and driving generative AI adoption.
  </text>
</svg>

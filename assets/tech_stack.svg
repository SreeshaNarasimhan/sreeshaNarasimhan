<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="100%">
  <defs>
    <linearGradient id="tsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A"/>
      <stop offset="50%" stop-color="#0E1629"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>
    <pattern id="tsGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .ts-title {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 2px;
      fill: #38BDF8;
    }
    .cat-title {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #A855F7;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #F8FAFC;
    }
  </style>

  <rect width="850" height="310" rx="10" fill="url(#tsBg)"/>
  <rect width="850" height="310" rx="10" fill="url(#tsGrid)"/>
  <rect width="848" height="308" x="1" y="1" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="35" y="32" class="ts-title">TECH MATRIX // CAPABILITY ENGINE</text>
  <text x="815" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#10B981" text-anchor="end">SYS_STACK: VERIFIED</text>
  <line x1="35" y1="45" x2="815" y2="45" stroke="#1E293B" stroke-width="1"/>

  <!-- CATEGORY 1: PROGRAMMING LANGUAGES -->
  <g transform="translate(35, 65)">
    <text x="0" y="14" class="cat-title" fill="#38BDF8">SYSTEM LANGUAGES</text>
    
    <!-- Badges -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="85" height="24" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="42.5" y="16" class="tag-text" text-anchor="middle">Python</text>

      <rect x="95" y="0" width="60" height="24" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="125" y="16" class="tag-text" text-anchor="middle">C</text>

      <rect x="165" y="0" width="70" height="24" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="200" y="16" class="tag-text" text-anchor="middle">C++</text>

      <rect x="245" y="0" width="105" height="24" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="297.5" y="16" class="tag-text" text-anchor="middle">JavaScript</text>

      <rect x="360" y="0" width="75" height="24" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="397.5" y="16" class="tag-text" text-anchor="middle">HTML5</text>

      <rect x="445" y="0" width="75" height="24" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="482.5" y="16" class="tag-text" text-anchor="middle">CSS3</text>
    </g>
  </g>

  <!-- CATEGORY 2: AI / ML / DEEP LEARNING -->
  <g transform="translate(35, 125)">
    <text x="0" y="14" class="cat-title" fill="#A855F7">AI &amp; INTELLIGENCE</text>
    
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
      <text x="70" y="16" class="tag-text" fill="#E0E7FF" text-anchor="middle">Generative AI</text>

      <rect x="150" y="0" width="170" height="24" rx="4" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
      <text x="235" y="16" class="tag-text" fill="#E0E7FF" text-anchor="middle">Large Language Models</text>

      <rect x="330" y="0" width="110" height="24" rx="4" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
      <text x="385" y="16" class="tag-text" fill="#E0E7FF" text-anchor="middle">AI Agents</text>

      <rect x="450" y="0" width="130" height="24" rx="4" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
      <text x="515" y="16" class="tag-text" fill="#E0E7FF" text-anchor="middle">Computer Vision</text>
    </g>
    
    <g transform="translate(180, 32)">
      <rect x="0" y="0" width="150" height="24" rx="4" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
      <text x="75" y="16" class="tag-text" fill="#E0E7FF" text-anchor="middle">Machine Learning</text>

      <rect x="160" y="0" width="70" height="24" rx="4" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
      <text x="195" y="16" class="tag-text" fill="#E0E7FF" text-anchor="middle">NLP</text>

      <rect x="240" y="0" width="165" height="24" rx="4" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
      <text x="322.5" y="16" class="tag-text" fill="#E0E7FF" text-anchor="middle">Prompt Engineering</text>
    </g>
  </g>

  <!-- CATEGORY 3: TOOLS, PLATFORMS & FRAMEWORKS -->
  <g transform="translate(35, 215)">
    <text x="0" y="14" class="cat-title" fill="#EC4899">TOOLS &amp; PLATFORMS</text>
    
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
      <text x="40" y="16" class="tag-text" text-anchor="middle">GitHub</text>

      <rect x="90" y="0" width="115" height="24" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
      <text x="147.5" y="16" class="tag-text" text-anchor="middle">Google Cloud</text>

      <rect x="215" y="0" width="90" height="24" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
      <text x="260" y="16" class="tag-text" text-anchor="middle">Power BI</text>

      <rect x="315" y="0" width="80" height="24" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
      <text x="355" y="16" class="tag-text" text-anchor="middle">OpenCV</text>

      <rect x="405" y="0" width="80" height="24" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
      <text x="445" y="16" class="tag-text" text-anchor="middle">FastAPI</text>

      <rect x="495" y="0" width="70" height="24" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
      <text x="530" y="16" class="tag-text" text-anchor="middle">React</text>
    </g>

    <g transform="translate(180, 32)">
      <rect x="0" y="0" width="105" height="24" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
      <text x="52.5" y="16" class="tag-text" text-anchor="middle">PostgreSQL</text>

      <rect x="115" y="0" width="95" height="24" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
      <text x="162.5" y="16" class="tag-text" text-anchor="middle">ChromaDB</text>

      <rect x="220" y="0" width="95" height="24" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
      <text x="267.5" y="16" class="tag-text" text-anchor="middle">MediaPipe</text>

      <rect x="325" y="0" width="75" height="24" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
      <text x="362.5" y="16" class="tag-text" text-anchor="middle">MQTT</text>

      <rect x="410" y="0" width="155" height="24" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
      <text x="487.5" y="16" class="tag-text" text-anchor="middle">Infosys Springboard</text>
    </g>
  </g>

  <!-- Footer line -->
  <line x1="35" y1="288" x2="815" y2="288" stroke="#1E293B" stroke-width="1"/>
</svg>

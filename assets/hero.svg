<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Scanning Line Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes scanMove {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(250px); opacity: 0.2; }
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes textGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.7)); }
    }
    .status-dot {
      animation: pulseDot 2s infinite ease-in-out;
      transform-origin: 48px 38px;
    }
    .scan-line {
      animation: scanMove 4s infinite linear;
    }
    .cursor {
      animation: blinkCursor 1s infinite;
    }
    .hero-title {
      animation: textGlow 4s infinite ease-in-out;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Fira Code', monospace;
      font-weight: 900;
      letter-spacing: 4px;
    }
    .sys-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Fira Code', monospace;
      font-size: 11px;
      fill: #94A3B8;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Container Box -->
  <rect width="850" height="250" rx="12" fill="url(#bgGlow)"/>
  <rect width="850" height="250" rx="12" fill="url(#grid)"/>
  <rect width="848" height="248" x="1" y="1" rx="11" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top System Bar -->
  <line x1="20" y1="52" x2="830" y2="52" stroke="#1E293B" stroke-width="1"/>
  
  <!-- Status Indicator -->
  <circle cx="48" cy="34" r="5" fill="#10B981" class="status-dot"/>
  <circle cx="48" cy="34" r="9" fill="none" stroke="#10B981" stroke-width="1" opacity="0.5"/>
  <text x="64" y="38" class="sys-text" fill="#10B981" font-weight="bold">SYSTEM STATUS: ONLINE</text>

  <!-- System Identifiers -->
  <text x="440" y="38" class="sys-text" text-anchor="middle">SYS_ID: <tspan fill="#F8FAFC">SREESHA.NARASIMHAN</tspan></text>
  <text x="830" y="38" class="sys-text" text-anchor="end" fill="#38BDF8">CORE: AI_UNIVERSE_v2.4</text>

  <!-- Title Section -->
  <text x="425" y="115" class="hero-title" font-size="34" fill="url(#titleGrad)" text-anchor="middle">SREESHA // AI UNIVERSE</text>
  <text x="425" y="145" class="sys-text" font-size="13" fill="#CBD5E1" text-anchor="middle" letter-spacing="3">AI &amp; DATA SCIENCE BUILDER  •  GENERATIVE AI &amp; AGENTS</text>

  <!-- Quote Card -->
  <rect x="180" y="165" width="490" height="30" rx="6" fill="#090D1A" stroke="#334155" stroke-width="1"/>
  <text x="425" y="184" font-family="'Segoe UI', Roboto, sans-serif" font-style="italic" font-size="13" fill="#38BDF8" text-anchor="middle">
    "Building intelligence that feels useful."
  </text>

  <!-- Currently Exploring Pipeline Footer -->
  <text x="425" y="222" class="sys-text" font-size="10.5" fill="#64748B" text-anchor="middle">
    CURRENTLY EXPLORING: <tspan fill="#E2E8F0">LLMs</tspan> <tspan fill="#38BDF8">➔</tspan> <tspan fill="#E2E8F0">RAG</tspan> <tspan fill="#38BDF8">➔</tspan> <tspan fill="#E2E8F0">AI AGENTS</tspan> <tspan fill="#38BDF8">➔</tspan> <tspan fill="#E2E8F0">INTELLIGENT PRODUCTS</tspan> <tspan class="cursor" fill="#38BDF8">█</tspan>
  </text>

  <!-- Scanning Overlay Line -->
  <rect x="0" y="0" width="850" height="3" fill="url(#scanGrad)" class="scan-line"/>
</svg>

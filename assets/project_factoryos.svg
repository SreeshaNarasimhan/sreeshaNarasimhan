<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="100%">
  <defs>
    <linearGradient id="foBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>
    <pattern id="foGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes flowDash2 {
      to { stroke-dashoffset: -30; }
    }
    .flow-line2 {
      stroke-dasharray: 6 6;
      animation: flowDash2 1.5s linear infinite;
    }
    .fo-title {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 2px;
      fill: #A855F7;
    }
    .block-text {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-size: 9.5px;
      font-weight: 700;
      fill: #F8FAFC;
    }
    .sub-text {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-size: 8px;
      fill: #94A3B8;
    }
  </style>

  <rect width="850" height="170" rx="10" fill="url(#foBg)"/>
  <rect width="850" height="170" rx="10" fill="url(#foGrid)"/>
  <rect width="848" height="168" x="1" y="1" rx="9" fill="none" stroke="#7C3AED" stroke-width="1.2" opacity="0.6"/>

  <!-- Title Line -->
  <text x="30" y="32" class="fo-title">FACTORYOS // SMART MANUFACTURING IIOT OPERATING SYSTEM</text>
  <text x="820" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#38BDF8" text-anchor="end">SENSORS ➔ DATA ➔ AI ➔ INSIGHT ➔ ACTION</text>

  <!-- Flow Diagram Blocks -->
  <!-- Block 1: IIoT Sensors & MQTT -->
  <g transform="translate(30, 60)">
    <rect width="135" height="65" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="67" y="28" class="block-text" text-anchor="middle" fill="#38BDF8">IIOT SENSORS</text>
    <text x="67" y="46" class="sub-text" text-anchor="middle">MQTT Broker • Telemetry</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="165" y1="92.5" x2="195" y2="92.5" stroke="#38BDF8" stroke-width="2" class="flow-line2"/>

  <!-- Block 2: FastAPI Gateway & Postgres -->
  <g transform="translate(195, 60)">
    <rect width="135" height="65" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="67" y="28" class="block-text" text-anchor="middle" fill="#22D3EE">DATA INGESTION</text>
    <text x="67" y="46" class="sub-text" text-anchor="middle">FastAPI • PostgreSQL</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="330" y1="92.5" x2="360" y2="92.5" stroke="#06B6D4" stroke-width="2" class="flow-line2"/>

  <!-- Block 3: Computer Vision & Edge AI -->
  <g transform="translate(360, 60)">
    <rect width="135" height="65" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1.5"/>
    <text x="67" y="28" class="block-text" text-anchor="middle" fill="#C084FC">EDGE AI &amp; VISION</text>
    <text x="67" y="46" class="sub-text" text-anchor="middle">OpenCV • Quality Inspection</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="495" y1="92.5" x2="525" y2="92.5" stroke="#A855F7" stroke-width="2" class="flow-line2"/>

  <!-- Block 4: Digital Twin AI Engine -->
  <g transform="translate(525, 60)">
    <rect width="135" height="65" rx="6" fill="#0F172A" stroke="#EC4899" stroke-width="1.5"/>
    <text x="67" y="28" class="block-text" text-anchor="middle" fill="#F43F5E">DIGITAL TWIN AI</text>
    <text x="67" y="46" class="sub-text" text-anchor="middle">Predictive Maintenance</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="660" y1="92.5" x2="690" y2="92.5" stroke="#10B981" stroke-width="2" class="flow-line2"/>

  <!-- Block 5: Dashboard Action -->
  <g transform="translate(690, 60)">
    <rect width="130" height="65" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="65" y="28" class="block-text" text-anchor="middle" fill="#34D399">INSIGHT &amp; ACTION</text>
    <text x="65" y="46" class="sub-text" text-anchor="middle">React Operational HUD</text>
  </g>

  <!-- Footer status line -->
  <line x1="30" y1="145" x2="820" y2="145" stroke="#1E293B" stroke-width="1"/>
  <text x="425" y="160" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B" text-anchor="middle">
    OBJECTIVE: End-to-end intelligent factory automation OS for smart MSMEs with Edge AI &amp; IIoT telemetry.
  </text>
</svg>

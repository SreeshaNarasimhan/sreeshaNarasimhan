<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="philBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>
    <linearGradient id="philBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <pattern id="philGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes glowText {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.7)); }
    }
    .phil-quote {
      font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
      font-weight: 800;
      font-size: 20px;
      fill: #F8FAFC;
      letter-spacing: 0.5px;
      animation: glowText 4s infinite ease-in-out;
    }
    .phil-tag {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #A855F7;
    }
  </style>

  <rect width="850" height="180" rx="10" fill="url(#philBg)"/>
  <rect width="850" height="180" rx="10" fill="url(#philGrid)"/>
  <rect width="848" height="178" x="1" y="1" rx="9" fill="none" stroke="url(#philBorder)" stroke-width="1.5"/>

  <!-- Top System Header -->
  <text x="40" y="36" class="phil-tag">CORE PHILOSOPHY // SYSTEM AXIOM</text>
  <line x1="330" y1="31" x2="810" y2="31" stroke="#1E293B" stroke-width="1"/>

  <!-- Main Quote Text -->
  <text x="425" y="88" class="phil-quote" text-anchor="middle">
    "I don't just learn technologies."
  </text>
  <text x="425" y="122" class="phil-quote" fill="#38BDF8" text-anchor="middle">
    "I turn them into things people can interact with."
  </text>

  <!-- Sub-caption Footer -->
  <text x="425" y="156" font-family="ui-monospace, monospace" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="2">
    PROMPT ➔ PROTOTYPE ➔ INTELLIGENT PRODUCT
  </text>
</svg>

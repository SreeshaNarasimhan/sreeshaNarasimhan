<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="100%">
  <defs>
    <linearGradient id="ehBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>
    <pattern id="ehGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes flowDash3 {
      to { stroke-dashoffset: -30; }
    }
    .flow-line3 {
      stroke-dasharray: 6 6;
      animation: flowDash3 1.5s linear infinite;
    }
    .eh-title {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 2px;
      fill: #EC4899;
    }
    .block-text {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-size: 9.5px;
      font-weight: 700;
      fill: #F8FAFC;
    }
    .sub-text {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-size: 8px;
      fill: #94A3B8;
    }
  </style>

  <rect width="850" height="170" rx="10" fill="url(#ehBg)"/>
  <rect width="850" height="170" rx="10" fill="url(#ehGrid)"/>
  <rect width="848" height="168" x="1" y="1" rx="9" fill="none" stroke="#DB2777" stroke-width="1.2" opacity="0.6"/>

  <!-- Title Line -->
  <text x="30" y="32" class="eh-title">ECHOHAND // INTEL GESTURE INTERACTION ENGINE</text>
  <text x="820" y="32" font-family="ui-monospace, monospace" font-size="10" fill="#10B981" text-anchor="end">AI HOUSE AGENTS LEADERBOARD FEATURED</text>

  <!-- Flow Diagram Blocks -->
  <!-- Block 1: Spatial Gesture Input -->
  <g transform="translate(45, 60)">
    <rect width="160" height="65" rx="6" fill="#0F172A" stroke="#EC4899" stroke-width="1.5"/>
    <text x="80" y="28" class="block-text" text-anchor="middle" fill="#F43F5E">SPATIAL GESTURE</text>
    <text x="80" y="46" class="sub-text" text-anchor="middle">Hand Landmarks Tracking</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="205" y1="92.5" x2="245" y2="92.5" stroke="#EC4899" stroke-width="2" class="flow-line3"/>

  <!-- Block 2: Vision Processing Engine -->
  <g transform="translate(245, 60)">
    <rect width="160" height="65" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="80" y="28" class="block-text" text-anchor="middle" fill="#38BDF8">COMPUTER VISION</text>
    <text x="80" y="46" class="sub-text" text-anchor="middle">Real-time Kinematics Engine</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="405" y1="92.5" x2="445" y2="92.5" stroke="#38BDF8" stroke-width="2" class="flow-line3"/>

  <!-- Block 3: Intent Parser -->
  <g transform="translate(445, 60)">
    <rect width="160" height="65" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1.5"/>
    <text x="80" y="28" class="block-text" text-anchor="middle" fill="#C084FC">INTENT PARSER</text>
    <text x="80" y="46" class="sub-text" text-anchor="middle">Neural Classifier &amp; State</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="605" y1="92.5" x2="645" y2="92.5" stroke="#A855F7" stroke-width="2" class="flow-line3"/>

  <!-- Block 4: System Action -->
  <g transform="translate(645, 60)">
    <rect width="160" height="65" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="80" y="28" class="block-text" text-anchor="middle" fill="#34D399">SYSTEM COMMAND</text>
    <text x="80" y="46" class="sub-text" text-anchor="middle">Autonomous System Execution</text>
  </g>

  <!-- Footer status line -->
  <line x1="30" y1="145" x2="820" y2="145" stroke="#1E293B" stroke-width="1"/>
  <text x="425" y="160" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B" text-anchor="middle">
    OBJECTIVE: Contactless spatial interaction framework mapping micro-gestures to intelligent agent intent.
  </text>
</svg>

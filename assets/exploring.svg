<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="100%">
  <defs>
    <linearGradient id="expBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>
    <pattern id="expGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseArrow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .exp-title {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 2px;
      fill: #A855F7;
    }
    .pipe-node {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #F8FAFC;
    }
    .pulse-arr {
      animation: pulseArrow 1.5s infinite ease-in-out;
    }
  </style>

  <rect width="850" height="140" rx="10" fill="url(#expBg)"/>
  <rect width="850" height="140" rx="10" fill="url(#expGrid)"/>
  <rect width="848" height="138" x="1" y="1" rx="9" fill="none" stroke="#A855F7" stroke-width="1.2" opacity="0.6"/>

  <text x="35" y="30" class="exp-title">CURRENTLY EXPLORING // ADVANCED AI RESEARCH PIPELINE</text>

  <!-- Flow Pipeline -->
  <g transform="translate(35, 55)">
    <!-- Stage 1: RAG -->
    <rect x="0" y="0" width="130" height="48" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="65" y="22" class="pipe-node" text-anchor="middle" fill="#38BDF8">RAG</text>
    <text x="65" y="37" font-family="ui-monospace, monospace" font-size="8" fill="#94A3B8" text-anchor="middle">Vector Embeddings</text>

    <!-- Arrow 1 -->
    <text x="145" y="28" font-family="ui-monospace, monospace" font-size="16" fill="#38BDF8" class="pulse-arr">➔</text>

    <!-- Stage 2: FINE-TUNING -->
    <rect x="170" y="0" width="130" height="48" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="235" y="22" class="pipe-node" text-anchor="middle" fill="#C084FC">FINE-TUNING</text>
    <text x="235" y="37" font-family="ui-monospace, monospace" font-size="8" fill="#94A3B8" text-anchor="middle">LoRA / QLoRA</text>

    <!-- Arrow 2 -->
    <text x="315" y="28" font-family="ui-monospace, monospace" font-size="16" fill="#8B5CF6" class="pulse-arr">➔</text>

    <!-- Stage 3: LANGCHAIN -->
    <rect x="340" y="0" width="130" height="48" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1.5"/>
    <text x="405" y="22" class="pipe-node" text-anchor="middle" fill="#E0E7FF">LANGCHAIN</text>
    <text x="405" y="37" font-family="ui-monospace, monospace" font-size="8" fill="#94A3B8" text-anchor="middle">Agentic Tooling</text>

    <!-- Arrow 3 -->
    <text x="485" y="28" font-family="ui-monospace, monospace" font-size="16" fill="#A855F7" class="pulse-arr">➔</text>

    <!-- Stage 4: AI AGENTS -->
    <rect x="510" y="0" width="130" height="48" rx="6" fill="#0F172A" stroke="#EC4899" stroke-width="1.5"/>
    <text x="575" y="22" class="pipe-node" text-anchor="middle" fill="#F43F5E">AI AGENTS</text>
    <text x="575" y="37" font-family="ui-monospace, monospace" font-size="8" fill="#94A3B8" text-anchor="middle">Multi-Agent Orchestration</text>

    <!-- Arrow 4 -->
    <text x="655" y="28" font-family="ui-monospace, monospace" font-size="16" fill="#EC4899" class="pulse-arr">➔</text>

    <!-- Stage 5: AI PRODUCTS -->
    <rect x="680" y="0" width="130" height="48" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="745" y="22" class="pipe-node" text-anchor="middle" fill="#34D399">AI PRODUCTS</text>
    <text x="745" y="37" font-family="ui-monospace, monospace" font-size="8" fill="#94A3B8" text-anchor="middle">Full-Stack Deployments</text>
  </g>

  <!-- Footer status -->
  <line x1="35" y1="118" x2="815" y2="118" stroke="#1E293B" stroke-width="1"/>
  <text x="425" y="131" font-family="ui-monospace, monospace" font-size="9" fill="#64748B" text-anchor="middle">
    ACTIVE FRONTIER: Scaling agentic reasoning architectures and low-latency local inference.
  </text>
</svg>

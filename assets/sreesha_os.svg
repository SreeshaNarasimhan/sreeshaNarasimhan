<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="osBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A"/>
      <stop offset="50%" stop-color="#0D1326"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="barActive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="barExploring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="barBuilding" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="barLearning" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="osGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes barPulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6)); }
    }
    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .os-title {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 2px;
      fill: #F8FAFC;
    }
    .engine-label {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #CBD5E1;
      letter-spacing: 1px;
    }
    .state-badge {
      font-family: ui-monospace, SFMono-Regular, Consolas, 'Fira Code', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .bar-rect {
      animation: barPulse 3s infinite ease-in-out;
    }
    .status-blink {
      animation: statusBlink 1.5s infinite ease-in-out;
    }
  </style>

  <!-- Window Outer Shell -->
  <rect width="850" height="330" rx="10" fill="url(#osBg)"/>
  <rect width="850" height="330" rx="10" fill="url(#osGrid)"/>
  <rect width="848" height="328" x="1" y="1" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- OS Window Title Bar -->
  <rect width="848" height="42" x="1" y="1" rx="9" fill="#0E1629"/>
  <line x1="1" y1="43" x2="849" y2="43" stroke="#1E293B" stroke-width="1"/>

  <!-- Window Control Buttons -->
  <circle cx="25" cy="22" r="5.5" fill="#EF4444"/>
  <circle cx="42" cy="22" r="5.5" fill="#F59E0B"/>
  <circle cx="59" cy="22" r="5.5" fill="#10B981"/>

  <!-- OS Header Text -->
  <text x="425" y="26" class="os-title" text-anchor="middle">SREESHA OS // AI CONTROL PANEL v4.0</text>
  <text x="825" y="26" font-family="ui-monospace, monospace" font-size="10" fill="#64748B" text-anchor="end">SYS_KERNEL: 6.8.0-AI</text>

  <!-- ================= CORE SYSTEMS PROGRESS BARS ================= -->

  <!-- ENGINE 1: LLM ENGINE -->
  <g transform="translate(40, 70)">
    <text x="0" y="14" class="engine-label">LLM ENGINE</text>
    <!-- Track background -->
    <rect x="180" y="2" width="460" height="16" rx="4" fill="#090D1A" stroke="#1E293B" stroke-width="1"/>
    <!-- Progress fill -->
    <rect x="182" y="4" width="410" height="12" rx="3" fill="url(#barActive)" class="bar-rect"/>
    <!-- State Badge -->
    <rect x="660" y="2" width="110" height="16" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="715" y="13" class="state-badge" fill="#38BDF8" text-anchor="middle">● ACTIVE</text>
  </g>

  <!-- ENGINE 2: GENAI ENGINE -->
  <g transform="translate(40, 115)">
    <text x="0" y="14" class="engine-label">GENAI ENGINE</text>
    <rect x="180" y="2" width="460" height="16" rx="4" fill="#090D1A" stroke="#1E293B" stroke-width="1"/>
    <rect x="182" y="4" width="370" height="12" rx="3" fill="url(#barExploring)" class="bar-rect"/>
    <rect x="660" y="2" width="110" height="16" rx="4" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
    <text x="715" y="13" class="state-badge" fill="#C084FC" text-anchor="middle">⚡ EXPLORING</text>
  </g>

  <!-- ENGINE 3: AGENT ENGINE -->
  <g transform="translate(40, 160)">
    <text x="0" y="14" class="engine-label">AGENT ENGINE</text>
    <rect x="180" y="2" width="460" height="16" rx="4" fill="#090D1A" stroke="#1E293B" stroke-width="1"/>
    <rect x="182" y="4" width="390" height="12" rx="3" fill="url(#barBuilding)" class="bar-rect"/>
    <rect x="660" y="2" width="110" height="16" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
    <text x="715" y="13" class="state-badge" fill="#F43F5E" text-anchor="middle">⚙️ BUILDING</text>
  </g>

  <!-- ENGINE 4: VISION ENGINE -->
  <g transform="translate(40, 205)">
    <text x="0" y="14" class="engine-label">VISION ENGINE</text>
    <rect x="180" y="2" width="460" height="16" rx="4" fill="#090D1A" stroke="#1E293B" stroke-width="1"/>
    <rect x="182" y="4" width="320" height="12" rx="3" fill="url(#barLearning)" class="bar-rect"/>
    <rect x="660" y="2" width="110" height="16" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="715" y="13" class="state-badge" fill="#34D399" text-anchor="middle">🧠 LEARNING</text>
  </g>

  <!-- ENGINE 5: FULL-STACK ENGINE -->
  <g transform="translate(40, 250)">
    <text x="0" y="14" class="engine-label">FULL-STACK ENGINE</text>
    <rect x="180" y="2" width="460" height="16" rx="4" fill="#090D1A" stroke="#1E293B" stroke-width="1"/>
    <rect x="182" y="4" width="380" height="12" rx="3" fill="url(#barActive)" class="bar-rect"/>
    <rect x="660" y="2" width="110" height="16" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="715" y="13" class="state-badge" fill="#38BDF8" text-anchor="middle">● ACTIVE</text>
  </g>

  <!-- Bottom OS Status Footer -->
  <line x1="20" y1="288" x2="830" y2="288" stroke="#1E293B" stroke-width="1"/>

  <text x="40" y="310" class="engine-label" font-size="10" fill="#94A3B8">
    SYSTEM STATUS: <tspan fill="#EC4899" class="status-blink">BUILDING</tspan>
  </text>

  <text x="810" y="310" class="engine-label" font-size="10" fill="#94A3B8" text-anchor="end">
    CURRENT PROCESS: <tspan fill="#38BDF8">AI SYSTEMS / EXPERIMENTS / PRODUCTS</tspan>
  </text>
</svg>
